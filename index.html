<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Discord Timestamp</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #232428;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            background: #313338;
            padding: 40px;
            border-radius: 16px;
            width: min(85%, 500px);
        }

        h1 {
            font-size: 22px;
            color: #b5bac1;
        }

        #timestamp {
            font-size: 32px;
            font-weight: bold;
            margin: 30px 0;
        }

        #timezone {
            color: #b5bac1;
            font-size: 14px;
        }

        .footer {
            margin-top: 30px;
            color: #949ba4;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>STREAM STARTS</h1>

        <div id="timestamp">Loading timestamp...</div>

        <div id="timezone"></div>

        <div class="footer">
            Automatically adjusted to your local timezone.
        </div>
    </div>

    <script>
        const parameters = new URLSearchParams(
            window.location.search
        );

        const unixTime = Number(parameters.get("time"));

        const timestampElement =
            document.getElementById("timestamp");

        const timezoneElement =
            document.getElementById("timezone");

        if (
            !Number.isSafeInteger(unixTime) ||
            unixTime <= 0
        ) {
            timestampElement.textContent =
                "Invalid or missing timestamp.";

            timezoneElement.textContent =
                "Please open a valid timestamp link.";

        } else {
            const date = new Date(unixTime * 1000);

            const weekday = new Intl.DateTimeFormat(
                undefined,
                { weekday: "long" }
            ).format(date);

            const time = new Intl.DateTimeFormat(
                undefined,
                {
                    hour: "numeric",
                    minute: "2-digit",
                    hour12: true
                }
            ).format(date);

            const timezone =
                Intl.DateTimeFormat()
                    .resolvedOptions().timeZone;

            timestampElement.textContent =
                `${weekday} at ${time}`;

            timezoneElement.textContent =
                `Your timezone: ${timezone}`;
        }
    </script>
</body>
</html>
